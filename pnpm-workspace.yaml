packages:
  - packages/*
  - examples/*
  - compat

# A version is installed only when it has been on the registry for 3 days (in minutes), which STANDARDS.md asks of every
# dependency. pnpm checks the lock file against it on every install.
minimumReleaseAge: 4320

# The verifier of the Interop Alliance, a counterparty of the tests, asks for zod 3, whose memory a constrained collection can
# exhaust (GHSA-mrhx-c7xc-m3w5) and which no release of 3 repairs.
overrides:
  "@interop/verifier-core>zod": 4.6.7
  # @xapi/cmi5, a counterparty of the tests, carries axios and @xapi/xapi in its build, so the copies that it declares are not
  # installed: their follow-redirects has a known vulnerability, and nothing loads them.
  "@xapi/cmi5>axios": "-"
  "@xapi/cmi5>@xapi/xapi": "-"

allowBuilds:
  core-js: false
  esbuild: false
  lefthook: false
  workerd: false

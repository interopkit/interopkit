events {}
http {
  client_max_body_size 512m;
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/run/cert.pem;
    ssl_certificate_key /etc/nginx/run/key.pem;
    location / {
      proxy_pass http://cts:3399;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
    }
  }
}

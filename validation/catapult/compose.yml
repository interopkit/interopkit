# The content suite of CATAPULT and its player over the pinned sources, which validation/catapult/content.ts builds and starts
# with a project, images and secrets of the run. Every service has at most 2 CPUs and 1 GiB, and only nginx is published, on
# the loopback address.
services:
  rdbms:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    cpus: 2
    mem_limit: 1g
    volumes:
      - ${SUITE_DIR}/cts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh:ro
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      DATABASE_USER: catapult
      DATABASE_USER_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: catapult_cts
      PLAYER_DATABASE_NAME: catapult_player
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-authentication-plugin=mysql_native_password",
      ]
  lrs:
    image: yetanalytics/lrsql@sha256:bf5661ab216d07175f6e429951bf53c79f6070d54812285ea4c208f991cf0a04
    platform: linux/amd64
    cpus: 2
    mem_limit: 1g
    environment:
      LRSQL_API_KEY_DEFAULT: ${LRS_USER}
      LRSQL_API_SECRET_DEFAULT: ${LRS_PASSWORD}
      LRSQL_ADMIN_USER_DEFAULT: admin
      LRSQL_ADMIN_PASS_DEFAULT: ${LRS_ADMIN}
      LRSQL_ALLOW_ALL_ORIGINS: "true"
  player:
    image: ${PLAYER_IMAGE}
    platform: linux/amd64
    cpus: 2
    mem_limit: 1g
    depends_on: [rdbms, lrs]
    environment:
      DB_HOST: rdbms
      DB_NAME: catapult_player
      DB_USERNAME: catapult
      DB_PASSWORD: ${DB_PASSWORD}
      LRS_ENDPOINT: http://lrs:8080/xapi/
      LRS_USERNAME: ${LRS_USER}
      LRS_PASSWORD: ${LRS_PASSWORD}
      TOKEN_SECRET: ${TOKEN_SECRET}
      API_KEY: ${PLAYER_KEY}
      API_SECRET: ${PLAYER_SECRET}
      CONTENT_URL: http://player:3398/content
  cts:
    image: ${CTS_IMAGE}
    platform: linux/amd64
    cpus: 2
    mem_limit: 1g
    depends_on: [rdbms, player]
    environment:
      DB_HOST: rdbms
      DB_NAME: catapult_cts
      DB_USERNAME: catapult
      DB_PASSWORD: ${DB_PASSWORD}
      PLAYER_BASE_URL: http://player:3398
      PLAYER_KEY: ${PLAYER_KEY}
      PLAYER_SECRET: ${PLAYER_SECRET}
      LRS_ENDPOINT: http://lrs:8080/xapi/
      LRS_USERNAME: ${LRS_USER}
      LRS_PASSWORD: ${LRS_PASSWORD}
      CTS_SESSION_COOKIE_PASSWORD: ${COOKIE_PASSWORD}
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    cpus: 1
    mem_limit: 256m
    depends_on: [cts]
    ports:
      - "127.0.0.1:${PORT}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${RUN_DIR}:/etc/nginx/run:ro

name: Rules

# Removes each rule that scripts/check-rules.ts lists from a copy of the code, and fails when its test still passes.
# It is slow, so it does not run on a push, as per-push CI stays short while Actions minutes are limited: a builder runs the
# rules of its package before a merge, with `pnpm check:rules packages/<package>`, and this workflow runs all of them each Monday,
# on "Run workflow", and from release.yml, which publishes only when they pass.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Called from release.yml, github.workflow is the caller's name: the suffix keeps the two groups apart.
concurrency:
  group: ${{ github.workflow }}-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    # No run has finished yet: lower this to three times the first green run.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The rules of the pages that run in a browser are checked in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:rules

name: Rules

# Removes each rule that scripts/rules/ lists from a copy of the code, and fails when its test still passes.
# It is slow, so it does not run on a push, as per-push CI stays short while Actions minutes are limited: a builder runs the
# rules of its package before a merge, with `pnpm check:rules packages/<package>`, and this workflow runs all of them each Monday,
# on "Run workflow", and from release.yml, which publishes only when they pass.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Called from release.yml, github.workflow is the caller's name: the suffix keeps the two groups apart.
concurrency:
  group: ${{ github.workflow }}-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    # No run has finished yet: lower this to three times the first green run.
    timeout-minutes: 240
    # The rules of the code that runs in a page are checked in Chromium, from the image of the Playwright that the lock file
    # pins, as in ci.yml, so that no install of a browser or its libraries can hold the job.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rules

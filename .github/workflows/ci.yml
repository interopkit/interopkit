name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a branch or a pull request cancels the run in progress: it holds the commits of the older run, and `changes`
# compares with the last run that passed, so what the cancelled run did not check is checked by the newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a push or a pull request changed since the last commit of main whose run passed, or since the base of a pull request,
  # and so which jobs have something to check. A job that is skipped passes a required check. When nothing can be compared,
  # for instance when no run has passed yet, every job runs. A job runs when a member of the workspace that it reads, or a member
  # that uses that one, changed (the packages, the examples and compat, with their dependencies read from their package.json
  # files); the lock file, the root configuration, the scripts that the tests share and this workflow reach every job; the
  # Markdown, the changesets and the configuration of the linters reach none but check. A file that no rule names reaches every
  # job. The guides of a package are tests of that package alone. Outputs: test, spec, browsers, bench, runtimes, opensalt,
  # adl_lrs, sql_lrs, w3c_suites, validator, pylti1p3, moodle and catapult say whether the job runs; projects and packages are the Vitest projects and the
  # packages whose coverage floors the test job checks. The rules job is in rules.yml.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      test: ${{ steps.filter.outputs.test }}
      projects: ${{ steps.filter.outputs.projects }}
      packages: ${{ steps.filter.outputs.packages }}
      spec: ${{ steps.filter.outputs.spec }}
      browsers: ${{ steps.filter.outputs.browsers }}
      bench: ${{ steps.filter.outputs.bench }}
      runtimes: ${{ steps.filter.outputs.runtimes }}
      opensalt: ${{ steps.filter.outputs.opensalt }}
      adl_lrs: ${{ steps.filter.outputs.adl_lrs }}
      sql_lrs: ${{ steps.filter.outputs.sql_lrs }}
      w3c_suites: ${{ steps.filter.outputs.w3c_suites }}
      validator: ${{ steps.filter.outputs.validator }}
      pylti1p3: ${{ steps.filter.outputs.pylti1p3 }}
      moodle: ${{ steps.filter.outputs.moodle }}
      catapult: ${{ steps.filter.outputs.catapult }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            BASE="$PULL_BASE"
          else
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$BRANCH&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || BASE=""
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=""
          export BASE
          node - <<'EOF'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync, readFileSync, readdirSync } = require("node:fs");

          const git = (...args) => execFileSync("git", args, { encoding: "utf8", maxBuffer: 1 << 27 });

          // The workspace: its packages, its examples and compat, each with the workspace packages it uses.
          const folders = (parent) =>
            readdirSync(parent, { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => `${parent}/${entry.name}`);
          const members = new Map();
          const names = new Map();
          for (const dir of [...folders("packages"), ...folders("examples"), "compat"]) {
            const manifest = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
            members.set(dir, manifest);
            names.set(manifest.name, dir);
          }
          const usedBy = (dir) => {
            const { dependencies, devDependencies, peerDependencies } = members.get(dir);
            return Object.keys({ ...dependencies, ...devDependencies, ...peerDependencies })
              .filter((name) => names.has(name))
              .map((name) => names.get(name));
          };
          const project = (dir) => (dir.startsWith("examples/") ? `example-${dir.slice(9)}` : dir.slice(9));

          // What changed. Null when there is nothing to compare with: everything is then checked.
          let changed = null;
          if (process.env.BASE) {
            try {
              changed = git("diff", "--name-only", "--no-renames", process.env.BASE, "HEAD").split("\n").filter(Boolean);
            } catch {
              changed = null;
            }
          }

          // A change to these reaches no job but check.
          const NOT_CHECKED =
            /^(\.changeset\/|\.github\/(?!workflows\/ci\.yml$)|[^/]+\.md$|LICENSE$|biome\.json$|biome\/|cspell\.json$|knip\.json$|typedoc\.json$|lefthook\.yml$|\.editorconfig$|validation\/[^/]+$)/;
          // The scripts that only check, or are checked by the tests of scripts. Every other script serves the tests of the packages.
          const OWN_SCRIPTS =
            /^scripts\/(test\/|check-standards\.ts$|check-licenses\.ts$|check-rules\.ts$|check-release\.ts$|check-tarballs\.ts$)/;
          // The scripts that the tests of one member alone read: a change to one reaches that member, as a change to its files does.
          const MEMBER_SCRIPTS = new Map([
            ["scripts/cmi5-requirements.ts", "packages/course-launch"],
            ["scripts/cmi5-rules.ts", "packages/course-launch"],
          ]);

          // The files that a test of scripts reads besides the scripts: every manifest, whose dependencies it holds to exact
          // versions, and the README of the W3C suites with their lock, which it compares.
          const SCRIPT_TESTED = /^(validation\/w3c-suites\/(README\.md|suites\.lock\.json)|(.+\/)?package\.json)$/;

          let everything = changed === null;
          let scriptTests = false;
          const touched = new Set();
          const guides = new Set();
          const validation = new Set();
          for (const file of changed ?? []) {
            const [top, name, third] = file.split("/");
            if (SCRIPT_TESTED.test(file)) scriptTests = true;
            if ((top === "packages" || top === "examples") && members.has(`${top}/${name}`)) touched.add(`${top}/${name}`);
            else if (top === "compat") touched.add("compat");
            else if (top === "docs" && third !== undefined && members.has(`packages/${name}`)) guides.add(`packages/${name}`);
            else if (top === "validation" && ["opensalt", "adl-lrs", "sql-lrs", "w3c-suites", "1edtech-validator", "pylti1p3", "moodle", "containers", "catapult"].includes(
                name,
              ))
              validation.add(name);
            else if (MEMBER_SCRIPTS.has(file)) touched.add(MEMBER_SCRIPTS.get(file));
            else if (OWN_SCRIPTS.test(file)) scriptTests = true;
            else if (!NOT_CHECKED.test(file)) everything = true;
          }

          // The members that the change reaches: those it touched, and the members that use them, however far.
          const reached = new Set(everything ? members.keys() : touched);
          for (let grew = true; grew; ) {
            grew = false;
            for (const dir of members.keys()) {
              if (!reached.has(dir) && usedBy(dir).some((used) => reached.has(used))) {
                reached.add(dir);
                grew = true;
              }
            }
          }
          const packages = [...reached].filter((dir) => dir.startsWith("packages/"));
          const examples = [...reached].filter((dir) => dir.startsWith("examples/"));

          // The Vitest projects of the tests, the packages whose coverage floors they check, and what each other job needs.
          const projects = new Set([...packages, ...examples, ...guides].map(project));
          if (everything || scriptTests) projects.add("scripts");
          const covered = new Set([...packages, ...guides].map((dir) => dir.slice(9)));
          const hasTest = (pattern) => (dir) => {
            try {
              return readdirSync(`${dir}/test`, { recursive: true }).some((file) => pattern.test(file));
            } catch {
              return false;
            }
          };

          const any = (dirs) => everything || dirs.length > 0;
          const outputs = {
            test: projects.size > 0 || reached.size > 0 || scriptTests,
            projects: [...projects].join(" "),
            packages: [...covered].join(" "),
            spec: any(packages.filter(hasTest(/spec[^/]*\.test\.ts$/))),
            browsers: any(packages.filter(hasTest(/\.browser\.test\.ts$/))),
            bench: any(packages.filter((dir) => members.get(dir).scripts?.bench)),
            runtimes: everything || examples.length > 0 || reached.has("compat"),
            opensalt: everything || reached.has("examples/competency-frameworks") || validation.has("opensalt"),
            adl_lrs: everything || reached.has("examples/learning-records") || validation.has("adl-lrs"),
            sql_lrs: everything || reached.has("examples/learning-records") || validation.has("sql-lrs"),
            w3c_suites: everything || reached.has("examples/achievement-credentials") || validation.has("w3c-suites"),
            validator: everything || reached.has("examples/achievement-credentials") || validation.has("1edtech-validator"),
            // The flows of the tool that PyLTI1p3 runs, against the platform role; the helpers of the containers are shared.
            pylti1p3: everything || reached.has("packages/tool-integration") || validation.has("pylti1p3") || validation.has("containers"),
            // Moodle in both roles against the roles of the package; the helpers of the containers are shared.
            moodle: everything || reached.has("packages/tool-integration") || validation.has("moodle") || validation.has("containers"),
            // Both suites of CATAPULT, against the LMS and the units of the cmi5 example.
            catapult: everything || reached.has("examples/course-launch") || validation.has("catapult"),
          };
          for (const [name, value] of Object.entries(outputs)) {
            console.log(`${name}=${value}`);
            if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          EOF

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:standards
      - run: pnpm knip
      - run: pnpm check:packages
      - run: pnpm check:release
      # Packs the packages, installs them into a scratch project, imports every subpath in Node.js and type-checks them.
      - run: pnpm check:tarballs
      - run: pnpm docs:api
      - run: pnpm check:licenses
      - run: pnpm check:audit
      # Version and Dependabot pull requests change package files without a changeset of their own.
      - if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          github.actor != 'dependabot[bot]'
        run: pnpm changeset status --since=origin/main

  # The tests of the Vitest projects that the change reaches, on each supported Node.js. TypeScript reads the same sources
  # whichever Node.js runs it, so one run of it is enough. The coverage floors of the packages among the projects are checked
  # once, on the oldest supported Node.js, by the same run that tests them. achievement-credentials asks for Node.js 24 in its
  # engines and runs on both legs: its tests pass on 22, where a dependency that began to need 24 would fail before the engines
  # said so, and its floor is measured there with the others (the deviations in AGENTS.md).
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.node == 22
        run: pnpm typecheck
      - if: needs.changes.outputs.projects != ''
        env:
          PROJECTS: ${{ needs.changes.outputs.projects }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          read -ra names <<< "$PROJECTS"
          read -ra packages <<< "$PACKAGES"
          projects=()
          for name in "${names[@]}"; do projects+=(--project "$name"); done
          if [ "$NODE_MAJOR" = 22 ] && [ "${#packages[@]}" -gt 0 ]; then
            include=()
            for name in "${packages[@]}"; do include+=("--coverage.include=packages/$name/src/**"); done
            pnpm test:coverage "${projects[@]}" "${include[@]}"
          else
            pnpm test "${projects[@]}"
          fi
      # The tests that read the files that pnpm schemas, pnpm corpus and pnpm caliper-tables download at their pinned hashes. Each
      # download is kept between runs by the hash of the lock that pins it, and a file that holds its pinned hash is not fetched.
      - if: needs.changes.outputs.projects != ''
        uses: actions/cache@v5
        with:
          path: .cache/schemas
          key: schemas-${{ hashFiles('scripts/schemas.lock.json') }}
      - if: needs.changes.outputs.projects != ''
        run: pnpm schemas
      # The repositories that pnpm corpus downloads, kept between runs by the hash of the lock that pins them.
      - if: needs.changes.outputs.projects != ''
        uses: actions/cache@v5
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('scripts/corpus.lock.json') }}
      - if: needs.changes.outputs.projects != ''
        run: pnpm corpus
      - if: needs.changes.outputs.projects != ''
        uses: actions/cache@v5
        with:
          path: .cache/caliper-tables
          key: caliper-tables-${{ hashFiles('scripts/caliper-tables.lock.json') }}
      - if: needs.changes.outputs.projects != ''
        run: pnpm caliper-tables
      - if: needs.changes.outputs.projects != ''
        run: pnpm test:corpus
      # The libraries of other authors that play the tool against the platform role of tool-integration, in the process of the tests.
      - if: needs.changes.outputs.projects != ''
        env:
          PROJECTS: ${{ needs.changes.outputs.projects }}
        run: |
          if [[ " $PROJECTS " == *" tool-integration "* ]]; then pnpm test:references; fi

  # The tests that read the examples of the specifications, downloaded at the hashes that scripts/spec-examples.lock.json pins,
  # and the files that they are compared with.
  spec:
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        with:
          path: .cache/spec-examples
          key: spec-examples-${{ hashFiles('scripts/spec-examples.lock.json') }}
      - run: pnpm spec-examples
      # The tables of the Caliper pages, which the tests of learning-analytics compare the model with.
      - uses: actions/cache@v5
        with:
          path: .cache/caliper-tables
          key: caliper-tables-${{ hashFiles('scripts/caliper-tables.lock.json') }}
      - run: pnpm caliper-tables
      # The test vectors of the cryptosuite read the contexts that pnpm schemas downloads.
      - uses: actions/cache@v5
        with:
          path: .cache/schemas
          key: schemas-${{ hashFiles('scripts/schemas.lock.json') }}
      - run: pnpm schemas
      # The oracle of the tests of learning-analytics reads the JSON schemas of Caliper from the repository that pnpm corpus
      # downloads, kept between runs by the hash of the lock that pins it.
      - uses: actions/cache@v5
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('scripts/corpus.lock.json') }}
      - run: pnpm corpus
      - run: pnpm test:spec

  # The pages of the client-side login, in the current Chromium, Firefox and WebKit.
  browsers:
    needs: changes
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser

  # The scenarios of the two examples, built as the packages ship, on Node.js, Deno, Bun and workerd (compat/README.md).
  runtimes:
    needs: changes
    if: needs.changes.outputs.runtimes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm compat

  # The hot paths of competency-frameworks on a framework of 10,000 items against the official schemas of CASE and the JSON, of
  # learning-records on 1,000 Statements against the validator of Learning Locker, node:crypto and jose, and of learning-analytics
  # on 1,000 events and entities against the draft 4 schemas of caliper-spec, each against the budgets of its test/budgets.ts and
  # its docs/<package>/evidence.md; the launch, the authorization and the pages of the services of tool-integration against jose
  # and JSON.parse; the three roles of ecdsa-sd-2023 against Digital Bazaar's suite (docs/selective-disclosure/proofs.md); the
  # proofs, the readers, the images, the status lists, the handlers and the verification of achievement-credentials against the
  # libraries of docs/achievement-credentials/comparators.md, in turns with each; and the cache, the readers of a body, the call
  # to a service and the signing of core against the platform APIs that they wrap. It builds first.
  bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The benchmarks of selective-disclosure and competency-frameworks read the contexts and the schemas that pnpm schemas
      # downloads at their pinned hashes.
      - uses: actions/cache@v5
        with:
          path: .cache/schemas
          key: schemas-${{ hashFiles('scripts/schemas.lock.json') }}
      - run: pnpm schemas
      # The benchmarks of learning-analytics read the fixtures and the schemas of caliper-spec that pnpm corpus downloads, and
      # those of course-launch the packages of CATAPULT.
      - uses: actions/cache@v5
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('scripts/corpus.lock.json') }}
      - run: pnpm corpus
      - run: pnpm bench

  # OpenSALT in containers as a counterparty of the CASE client and provider (validation/opensalt/README.md).
  opensalt:
    needs: changes
    if: needs.changes.outputs.opensalt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm opensalt

  # Moodle in containers as a counterparty of both roles of tool-integration (validation/moodle/README.md).
  moodle:
    needs: changes
    if: needs.changes.outputs.moodle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm moodle

  # The ADL conformance suites of xAPI 2.0 and 1.0.3 against the example LRS (validation/adl-lrs/README.md). It builds first.
  adl-lrs:
    needs: changes
    if: needs.changes.outputs.adl_lrs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm adl-lrs

  # SQL LRS in a container as the oracle of the rules and a counterparty of the client (validation/sql-lrs/README.md).
  sql-lrs:
    needs: changes
    if: needs.changes.outputs.sql_lrs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sql-lrs

  # The W3C suites of Data Integrity, its EdDSA and ECDSA cryptosuites, Bitstring Status List and the Data Model 2.0, at their
  # pinned commits, against the VC-API service of the credentials example (validation/w3c-suites/README.md). It builds first.
  w3c-suites:
    needs: changes
    if: needs.changes.outputs.w3c_suites == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The service serves the contexts that pnpm schemas downloads at their pinned hashes, and no other.
      - uses: actions/cache@v5
        with:
          path: .cache/schemas
          key: schemas-${{ hashFiles('scripts/schemas.lock.json') }}
      - run: pnpm schemas
      - run: pnpm w3c-suites

  # The public validator of 1EdTech, built from its pinned commit in a container, against the credentials of the example
  # (validation/1edtech-validator/README.md).
  validator:
    needs: changes
    if: needs.changes.outputs.validator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The credentials of the test are signed under the contexts that pnpm schemas downloads at their pinned hashes.
      - uses: actions/cache@v5
        with:
          path: .cache/schemas
          key: schemas-${{ hashFiles('scripts/schemas.lock.json') }}
      - run: pnpm schemas
      - run: pnpm validator

  # CATAPULT's LMS suite in the Chromium of Playwright against the example LMS of cmi5 (validation/catapult/README.md). It builds
  # first.
  catapult-lms:
    needs: changes
    if: needs.changes.outputs.catapult == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The archive of CATAPULT at its pinned commit, kept between runs by the hash of the lock that pins it.
      - uses: actions/cache@v5
        with:
          path: .cache/catapult/suite
          key: catapult-${{ hashFiles('validation/catapult/suite.lock.json') }}
      - run: pnpm catapult-lms

  # CATAPULT's content suite and its player in containers, with the units of the cmi5 example played by the runtime of the
  # package (validation/catapult/README.md). The images are kept between runs by the hash of the lock and of their Dockerfiles.
  catapult-content:
    needs: changes
    if: needs.changes.outputs.catapult == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        with:
          path: .cache/catapult/suite
          key: catapult-${{ hashFiles('validation/catapult/suite.lock.json') }}
      - id: images
        uses: actions/cache@v5
        with:
          path: .cache/catapult-images.tar
          key: catapult-images-${{ hashFiles('validation/catapult/suite.lock.json', 'validation/catapult/*.Dockerfile') }}
      - if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i .cache/catapult-images.tar
      - run: pnpm catapult-content
      - if: steps.images.outputs.cache-hit != 'true'
        run: docker save -o .cache/catapult-images.tar $(docker image ls --filter 'reference=interopkit-catapult-*' --format '{{.Repository}}:{{.Tag}}')

  # PyLTI1p3 in a container as a counterparty of the platform role (validation/pylti1p3/README.md).
  pylti1p3:
    needs: changes
    if: needs.changes.outputs.pylti1p3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

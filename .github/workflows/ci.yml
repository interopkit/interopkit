name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:standards
      - run: pnpm knip
      - run: pnpm check:packages
      - run: pnpm docs:api
      - run: pnpm check:licenses
      - run: pnpm check:audit
      # Version and Dependabot pull requests change package files without a changeset of their own.
      - if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          github.actor != 'dependabot[bot]'
        run: pnpm changeset status --since=origin/main

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The tests that read the files that pnpm schemas downloads at their pinned hashes.
      - run: pnpm schemas
      - run: pnpm test:corpus
      # The coverage floor of each package (vitest.config.ts) is checked once, on the oldest supported Node.js.
      - if: matrix.node == 22
        run: pnpm test:coverage

  # Removes each security rule that scripts/check-rules.ts lists from a copy of the code, and fails when its test still passes.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The rules of the pages that run in a browser are checked in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:rules

  # The tests that read the examples of the specifications, downloaded at the hashes that scripts/spec-examples.lock.json pins.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec-examples
      - run: pnpm test:spec

  # The pages of the client-side login, in the current Chromium, Firefox and WebKit.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser

  # The scenarios of the two examples, built as the packages ship, on Node.js, Deno, Bun and workerd (compat/README.md).
  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm compat

  # The time to read, check and walk a framework of 10,000 items, against the budgets of
  # packages/competency-frameworks/test/budgets.ts (docs/competency-frameworks/evidence.md). It builds first.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench

  # OpenSALT in containers as a counterparty of the CASE client and provider (validation/opensalt/README.md).
  opensalt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm opensalt

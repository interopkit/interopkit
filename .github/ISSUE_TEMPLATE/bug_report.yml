name: Bug report
description: Report a result or behavior of an interopkit package that is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities privately, as the [security policy](https://github.com/interopkit/interopkit/security/policy)
        describes, not here.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@interopkit/core"
        - "@interopkit/tool-integration"
        - "@interopkit/learning-analytics"
        - "@interopkit/competency-frameworks"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version from `npm ls @interopkit/core`, or the commit if you build from source.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Deno
        - Bun
        - Cloudflare Workers
        - Browser
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: The output of `node --version`, or the runtime and its version.
      placeholder: v22.18.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that fails and runs as pasted.
      render: typescript
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Specification section
      description: The section of the specification that defines the behavior you expected, such as LTI Core section 5.3.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with the full error message if there is one.
    validations:
      required: true

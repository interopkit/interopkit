name: Feature request
description: Suggest a feature for an interopkit package.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what is missing for it.
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference
      description: The section of the specification the feature belongs to.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like, with a short usage example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, including doing it outside the library.
